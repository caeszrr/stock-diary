name: Fetch TW market data

on:
  schedule:
    # 07:10 UTC = 15:10 Taipei, shortly after the 13:30 close. Weekdays only.
    - cron: '10 7 * * 1-5'
    # Retry: 08:10 UTC. The fetch scripts now self-heal (targeted per-symbol
    # repair of any missing watchlist symbol) and write a completeness verdict
    # to data/status.json's `coverage`. A run that is still INCOMPLETE (not just
    # absent) exits non-zero, so this retry cron meaningfully re-attempts an
    # incomplete session instead of trusting "a file exists" as success.
    - cron: '10 8 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # continue-on-error so an incomplete/failed session still commits the
      # partial data + the coverage record (marked complete:false) below —
      # "commit partial if that's all the source will give, but never mark it
      # complete." The run is failed at the end for visibility + retry.
      - name: Fetch TWSE (上市)
        id: fetch-tw
        continue-on-error: true
        run: npm run fetch:tw

      - name: Fetch TPEx (上櫃)
        id: fetch-tpex
        continue-on-error: true
        run: npm run fetch:tpex

      - name: Check for changes
        id: git-check
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push data
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update TW market data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Setup Pages
        if: steps.git-check.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Build
        if: steps.git-check.outputs.changed == 'true'
        run: npm run build

      - name: Upload Pages artifact
        if: steps.git-check.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.git-check.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      # Surface an incomplete/failed session (data + coverage already committed
      # above): fail the run so it's visible and the retry cron re-attempts.
      - name: Fail run if a session was incomplete
        if: steps.fetch-tw.outcome == 'failure' || steps.fetch-tpex.outcome == 'failure'
        run: |
          echo "::warning::A TW session was incomplete or failed — see data/status.json coverage + the fetch step logs. The retry cron will re-attempt; the watchdog will escalate if it persists."
          exit 1
